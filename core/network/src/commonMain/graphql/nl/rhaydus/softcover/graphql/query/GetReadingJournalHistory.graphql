query GetReadingJournalHistory(
    $bookId: Int!,
    $userId: Int!,
    $limit: Int!,
    $offset: Int!,
) {
    reading_journals(
        where: {
            book_id: { _eq: $bookId }
            user_id: { _eq: $userId }
            event: { _eq: "progress_updated" }
        }
        # id breaks action_at ties so every offset window is a fixed, non-overlapping slice.
        order_by: [{ action_at: asc }, { id: asc }]
        limit: $limit
        offset: $offset
    ) {
        action_at
        metadata
    }
}
