# A lean, paginated fetch of every finished book for client-side stat aggregation (year/month
# columns, ratings histogram, genre breakdown, total pages, author demographics). No covers/author
# names here - those are only needed for the small recently-loved list in GetUserProfileData. 1 root
# field (me).
query GetReadUserBooksForStats($limit: Int!, $offset: Int!) {
    me {
        user_books(
            where: { status_id: { _eq: 3 } }
            order_by: { last_read_date: desc_nulls_last }
            limit: $limit
            offset: $offset
        ) {
            rating
            last_read_date
            user_book_read_finished_journal: reading_journals(
                where: { event: { _eq: "user_book_read_finished" } }
                order_by: { updated_at: desc }
                limit: 1
            ) {
                ...ReadingJournalFragment
            }
            edition {
                pages
            }
            book {
                pages
                # Every genre tag on the book, deliberately uncapped: the "most-read genre" ranking
                # is computed client-side in toGenreBreakdown, so a server-side cut here would decide
                # the answer before the client ever sees the data. A previous `limit: 5` did exactly
                # that - ordered by popularity, it dropped each book's niche tags, which is the end
                # of the distribution a personal most-read ranking is supposed to surface. The
                # ordering is kept only so the rows arrive most-agreed-upon first; nothing downstream
                # depends on it.
                taggable_counts(
                    where: { tag: { tag_category: { category: { _eq: "Genre" } } } }
                    order_by: { count: desc }
                ) {
                    # The name alone - the where-clause above already guarantees every row is a Genre,
                    # so selecting tag_category back would return the same constant on every row and
                    # answer a question this query has no way of asking.
                    tag {
                        tag
                    }
                }
                # Only the fields the author-demographics aggregation needs - id for cross-book
                # dedupe, no name, to keep this per-book, paginated payload lean.
                contributions {
                    author {
                        id
                        is_bipoc
                        is_lgbtq
                        gender_id
                    }
                }
            }
        }
    }
}
