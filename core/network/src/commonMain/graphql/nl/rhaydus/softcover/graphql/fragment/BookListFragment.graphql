fragment BookListFragment on books {
    id
    canonical {
        id
    }
    title
    headline
    description
    rating
    image {
        url
    }
    release_year
    release_date
    pages
    users_count
    ratings_count
    compilation
    book_series(order_by: { position: asc }) {
        ...BookSeriesFragment
    }
    contributions {
        contribution
        contributor_role_id
        author {
            id
            name
            is_bipoc
            is_lgbtq
            gender_id
        }
    }
    taggable_counts(order_by: { count: desc }) {
        ...BookTagFragment
    }
}
