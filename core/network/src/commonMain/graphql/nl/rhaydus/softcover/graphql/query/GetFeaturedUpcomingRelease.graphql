# The single highest-anticipated book releasing soon (Explore's featured card): the most-shelved
# book whose release date falls within the upcoming window (today, maxDate]. A book's release_date
# is its own debut, not any edition's, so a new edition of an older book never qualifies. No
# minimum-readers floor - the point of the card is discovery, so whichever book is most-wanted for
# that window qualifies regardless of how well-known it already is.
query GetFeaturedUpcomingRelease(
    $today: date!,
    $maxDate: date!,
) {
    books(
        where: {
            release_date: { _gt: $today, _lte: $maxDate }
        }
        order_by: [{ users_count: desc }]
        limit: 1
    ) {
        ...BookDetailFragment
    }
}
