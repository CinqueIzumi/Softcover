query FindTagsByUser(
    $userId: Int!,
) {
    taggings(
        where: {
            user_id: {
                _eq: $userId
            }
        },
        order_by: {
            tag: {
                tag_category_id: asc
            }
        }
    ) {
        ...TaggingFragment
        tag {
            ...TagFragment
        }
    }
}
