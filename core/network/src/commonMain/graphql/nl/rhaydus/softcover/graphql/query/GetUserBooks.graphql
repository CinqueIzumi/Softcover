query GetUserBooks($statusIds: [Int!], $userBookIds: [Int!], $limit: Int!, $offset: Int!) {
    me {
        user_books(
            where: {
                _or: [
                    { status_id: { _in: $statusIds } },
                    { id: { _in: $userBookIds } }
                ]
            },
            order_by: { id: asc },
            limit: $limit,
            offset: $offset
        ) {
            ...UserBookFragment
        }
        total: user_books_aggregate(
            where: {
                _or: [
                    { status_id: { _in: $statusIds } },
                    { id: { _in: $userBookIds } }
                ]
            }
        ) {
            aggregate {
                count
            }
        }
    }
}
