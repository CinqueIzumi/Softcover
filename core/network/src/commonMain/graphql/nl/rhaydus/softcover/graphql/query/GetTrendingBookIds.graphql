# Trending ids for one of Hardcover's five durations (week, month, three_month, one_year, all);
# each returns the same 25-id shape. from/to/limit/offset are deprecated on books_trending and
# dropped entirely.
query GetTrendingBookIds($duration: TrendingDuration!) {
    books_trending(duration: $duration) {
        ids
    }
}
