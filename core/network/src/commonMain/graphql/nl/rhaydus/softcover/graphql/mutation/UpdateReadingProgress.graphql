mutation UpdateReadingProgress(
    $id: Int!,
    $datesReadInput: DatesReadInput!
) {
    update_user_book_read(
        id: $id,
        object: $datesReadInput
    ) {
        error
        id
        user_book_read {
            ...UserBookReadFragment
            user_book {
                ...UserBookFragment
            }
        }
    }
}
