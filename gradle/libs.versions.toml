[versions]
agp = "9.0.0"
kotlin = "2.3.21"
ktlint = "1.7.1"
coreKtx = "1.17.0"
okio = "3.9.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.0"
composeBom = "2026.01.01"
apollo = "5.0.0"
dataStore = "1.2.0"
kotlinxSerialization = "1.9.0"
ksp = "2.3.9"
voyager = "1.1.0-beta02"
coilVersion = "3.2.0"
composeMultiplatform = "1.11.0"
# CMP's stable material3 strips the M3-expressive APIs (aligned with Jetpack material3 1.4.0-beta01).
# The design system is built on expressive (MaterialExpressiveTheme/ToggleButton/SplitButton), so it
# pins the alpha material3 artifact for the 1.11.0 line (≈ androidx material3 1.5.0-alpha17), the CMP
# counterpart of the Android-only androidx 1.5.0-alpha13 pin below.
composeMaterial3Expressive = "1.11.0-alpha07"
material3ComposeVersion = "1.5.0-alpha13"
materialComponentsVersion = "1.13.0"
kermitVersion = "2.0.6"
kotlinxDatetime = "0.7.1"
koinVersion = "3.5.3"
# Multiplatform koin-compose is versioned separately from koin core; 1.1.x targets Koin 3.5.x.
koinComposeMultiplatform = "1.1.2"
roomVersion = "2.7.2"
splashVersion = "1.0.1"
jUnitVersion = "5.11.4"
junitPlatform = "1.11.4"
kotestVersion = "5.9.1"
mockkVersion = "1.13.17"
turbineVersion = "1.2.0"
appUpdateVersion = "2.1.0"
workVersion = "2.10.1"
reorderableVersion = "2.4.3"
cameraX = "1.4.2"
mlkitBarcode = "17.3.0"
coroutines = "1.10.2"
# Ktor powers Coil's network image loading on iOS only (Coil's OkHttp fetcher is JVM/Android-only and
# Apollo brings no Ktor engine to reuse). Aligned with the Ktor 3.x line Coil 3.2.0 is built against.
ktor = "3.1.0"
detekt = "1.23.8"
dependencyAnalysis = "3.14.1"
sqlite = "2.6.2"

[libraries]
# ktlint rule-engine — consumed by the :ktlint-rules module to drive the custom autofix ruleset
ktlint-ruleEngine = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine", version.ref = "ktlint" }
ktlint-ruleEngineCore = { group = "com.pinterest.ktlint", name = "ktlint-rule-engine-core", version.ref = "ktlint" }
ktlint-cliRulesetCore = { group = "com.pinterest.ktlint", name = "ktlint-cli-ruleset-core", version.ref = "ktlint" }

# Gradle plugin artifacts — consumed by build-logic convention plugins (compileOnly)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
