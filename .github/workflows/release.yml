name: Release

# Builds the Android (APK + AAB) and desktop (dmg/msi/deb) artifacts for a pushed tag and attaches
# them to a GitHub release. On a stable tag the signed AAB is additionally uploaded to Google Play as
# a *production draft* — release notes and the final Publish are done by hand in the Play Console.
# iOS is intentionally out of scope until Apple signing is wired up.
on:
  push:
    tags:
      - "v*"

# A release is keyed to an immutable tag, so a re-run should replace, never duplicate.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK + AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Stage artifacts
        run: |
          mkdir -p staging
          cp app/build/outputs/apk/release/*.apk "staging/Softcover-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "staging/Softcover-${GITHUB_REF_NAME}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: staging/*
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: dmg
            format: dmg
          - os: windows-latest
            label: msi
            format: msi
          - os: ubuntu-latest
            label: deb
            format: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Each runner builds only the installer native to its OS via the current-OS package task. The
      # non-release variant is used deliberately: the release variant runs ProGuard, which this project
      # has no desktop keep-rules for and would strip Koin/Apollo/serialization reflection at runtime.
      - name: Build installer
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p staging
          src=$(find desktopApp/build/compose/binaries/main/${{ matrix.format }} -name "*.${{ matrix.format }}" | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::No .${{ matrix.format }} produced under main."
            exit 1
          fi
          ext="${src##*.}"
          cp "$src" "staging/Softcover-${GITHUB_REF_NAME}-${{ matrix.label }}.${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: staging/*
          if-no-files-found: error

  play:
    name: Upload to Google Play (production draft)
    needs: android
    runs-on: ubuntu-latest
    # The app's first production upload had to be done by hand (the Play API can't create a listing);
    # this automation targets that existing listing. Pre-release tags (e.g. v3.0.0-rc1) still build and
    # attach to the GitHub release but are never pushed to Play — only clean vX.Y.Z tags upload.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Verify service account secret
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set — cannot upload to Google Play."
            exit 1
          fi

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android
          path: android

      - name: Locate AAB
        id: aab
        run: |
          path=$(find android -name "*.aab" | head -n 1)
          if [ -z "$path" ]; then
            echo "::error::No .aab found in the android artifact."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # status: draft uploads the bundle to a production draft release — it is NOT rolled out. Release
      # notes and the final Publish happen manually in the Play Console, so no whatsNewDirectory is set.
      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: nl.rhaydus.softcover
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: production
          status: draft

  release:
    name: Publish release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          # Tags with a pre-release suffix (e.g. v2.4.0-rc1) are flagged as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
