name: CI (full gate)

# Push-only on purpose. Required status checks are read from the pull request's head commit, so
# the run a branch push produces is what the PR into main reports, and a pull_request trigger
# would build the same commit a second time. The main ruleset requires branches to be up to date,
# which makes the pushed tip the exact tree that merges. The branch list is every family that
# opens pull requests into main.
on:
  push:
    branches: [main, 'release/**', 'hotfix/**', 'chore/**']

# Keyed by commit so a later push never cancels a run whose checks a PR may still need.
concurrency:
  group: ci-full-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Shared with ci-fast.yml so PR runs restore what pushes to their base branch saved.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: jvm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # setup-gradle only writes on the default branch unless told otherwise; release and
          # hotfix pushes must save so the next push and the PRs into them start warm.
          cache-read-only: false

      - name: Check
        run: ./gradlew check koverXmlReport :build-logic:test -x lint --continue --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint & build health
    runs-on: ubuntu-latest
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Lint and build health
        run: ./gradlew lint buildHealth --continue --stacktrace

  r8-smoke:
    uses: ./.github/workflows/r8-smoke.yml
    secrets:
      HARDCOVER_SMOKE_TOKEN: ${{ secrets.HARDCOVER_SMOKE_TOKEN }}

  ios-compile:
    name: iOS compile
    # The iOS compile gates in the root build are guarded to macOS hosts, so only this job runs them.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Kotlin version: keep in sync with `kotlin` in gradle/libs.versions.toml.
      - name: Restore Kotlin/Native cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-2.4.21

      - name: Compile iOS
        # The 6g/12g heap ceilings in gradle.properties exceed the runner's 7 GB RAM; klib
        # compilation needs no LTO heap.
        run: >-
          ./gradlew compileKotlinIosArm64 compileKotlinIosSimulatorArm64 --continue --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.native.jvmArgs=-Xmx3g

      - name: Save Kotlin/Native cache
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-2.4.21
