name: CI

on:
  pull_request:
  push:
    branches: [main]
    # ROADMAP.md is regenerated and committed to main by the Roadmap workflow whenever a
    # milestone description changes. Running the full Android + JVM build for a markdown
    # commit buys nothing. Left off `pull_request` on purpose: if main ever becomes
    # protected, a skipped required check blocks the merge queue.
    paths-ignore:
      - "ROADMAP.md"
      - "docs/**"
      - "**/*.md"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test & coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The iOS compile gates in the root build are guarded to macOS hosts, so they are skipped here;
      # this job covers the Android + JVM (desktop) sources, which is where the unit tests run.
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: detekt
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Coverage report
        run: ./gradlew koverXmlReport --stacktrace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
