# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 6 GB: headroom for the Gradle daemon itself (AGP resource merging, R8, the Kotlin JVM compile
# daemon's parent process). This no longer governs the Kotlin/Native link — that compiler runs in its
# own daemon and is sized by kotlin.native.jvmArgs below.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
# 12 GB for the Kotlin/Native compiler daemon. The iOS *release* framework link
# (:orchestration:linkRelease*FrameworkIos*) runs the LTO devirtualization phase, which exhausts the
# default heap and fails with an OutOfMemoryError in DevirtualizationAnalysis; it links cleanly at
# this size. Debug links skip that phase, so only release/Archive builds need it. This must live here
# rather than on the command line: Xcode's embedAndSign invocation reads gradle.properties, so a -P
# flag would not reach the Archive build. -Xmx is a ceiling, not a reservation, so builds that do not
# need it pay nothing.
kotlin.native.jvmArgs=-Xmx12g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# AGP 9 ships built-in Kotlin, but KSP (used by :core:database for Room) is not yet compatible
# with it. Keep AGP's built-in Kotlin disabled and continue applying the org.jetbrains.kotlin.android
# plugin explicitly until KSP supports built-in Kotlin. Revisit when KSP adds support.
android.builtInKotlin=false
# The external org.jetbrains.kotlin.android plugin is not compatible with AGP 9's new DSL
# (android.newDsl=true by default). Since built-in Kotlin is off (KSP, above), keep the legacy DSL so
# the Kotlin plugin applies. Tied to the builtInKotlin opt-out; both go away once KSP supports built-in Kotlin.
android.newDsl=false
