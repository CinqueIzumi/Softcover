# Softcover detekt overrides — layered ON TOP of the shared nl.rhaydus baseline.
#
# The baseline (`config/detekt.yml`, bundled in `nl.rhaydus:detekt-rules`, unpacked by the root
# `extractRhaydusDetektConfig` task) carries everything every nl.rhaydus app wants: the Compose/TOAD
# `ignoreAnnotated` sets, `MagicNumber` off, `LargeClass`, the generous DI constructor threshold,
# guard-clause `ReturnCount`, snake_case `PackageNaming`, `MaxLineLength: 140`, `UnusedPrivateMember`,
# and the type-resolution calibration. Both files reach `config.setFrom(...)` in that order, so THIS
# file wins on conflict.
#
# Keep only Softcover-specific calibration here. Where a rule is relaxed below, it is because detekt's
# default disagrees with a DOCUMENTED Softcover convention (docs/reference/architecture.md,
# docs/reference/module-structure.md, docs/reference/code-style.md) or with an unavoidable Apollo/Room
# shape — calibration to this project, not debt-hiding. Nothing is disabled to make a finding go away.
#
# Runs with `buildUponDefaultConfig = true` and NO baseline file: detekt gates from zero, so every active
# rule's findings are real debt to fix. Analysis is TYPE-RESOLVED and covers commonMain plus the platform
# source sets (androidMain / jvmMain / mobileMain); generated code is excluded in the Gradle wiring.
# Layout / whitespace / import formatting is owned by nl.rhaydus:ktlint-rules, so detekt's `formatting`
# ruleset is intentionally not on the classpath.

complexity:
  LongMethod:
    # Room migration blocks and the nav host legitimately run long; accept up to 140 lines.
    threshold: 140
    # Test sources are exempt, and this one IS a judgement call rather than detekt's own policy (unlike
    # the test excludes in the shared baseline, which merely restore globs detekt already intends).
    # Reason: every finding here was an Apollo fragment fixture in `core/book` — `stubMinimalUserBookFragment`
    # and the `BookMapperTest` cases that inline one — where the length is the *width of the GraphQL
    # fragment*, one `every { field } returns …` mockk stub per field. Two things inflate it further: the
    # fragments are wide by nature, and this repo's own ktlint rule requires each inline mockk stub to open
    # onto its own line, tripling every stub. Splitting such a fixture yields `…Part1` / `…Part2` halves
    # that are strictly harder to read than the thing they replace, so the rule is asking for a change that
    # would make the code worse. Production code keeps the full 140-line gate.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidHostTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
  CyclomaticComplexMethod:
    threshold: 25
  ComplexCondition:
    threshold: 6
  NestedBlockDepth:
    threshold: 6
  LongParameterList:
    # TOAD *ScreenModel / *Dependencies constructors grow every time a screen gains a use case (book
    # detail alone is 30+ params) — a parameter object isn't idiomatic for constructor DI, and the
    # count has no natural ceiling, so a numeric threshold bump here would need to be revisited on
    # every future use case addition. Exclude the layer by path instead of chasing the count: every
    # TOAD screen keeps its ScreenModel + Dependencies under `presentation/screenmodel/` by convention
    # (see docs/rhaydus/0.3.0/toad-architecture.md), so this targets exactly the DI-constructor classes
    # and leaves the rule at full strength (the baseline's threshold: 30) everywhere else.
    excludes: ['**/presentation/screenmodel/**']
    functionThreshold: 12
    ignoreDefaultParameters: true
  TooManyFunctions:
    # DAOs (BookDao has ~90 queries), operation repositories, and Compose screen objects legitimately
    # hold many members; @Composable members are not counted.
    thresholdInFiles: 100
    thresholdInClasses: 100
    thresholdInInterfaces: 100
    thresholdInObjects: 100
    thresholdInEnums: 100
    ignoreAnnotatedFunctions: ['Composable', 'Preview', 'StandardPreview']

style:
  UnusedPrivateMember:
    # The shared baseline also exempts `Composable`. Softcover deliberately does not: an unused private
    # @Composable is dead UI code and should be caught. Only previews are exempt (they are entry points).
    ignoreAnnotated: ['Preview', 'StandardPreview']
  ForbiddenComment:
    # TODO / FIXME / etc. are legitimate, tracked markers in this codebase — not a code smell to gate on.
    active: false
  LoopWithTooManyJumpStatements:
    # Two jumps in a filtering/iteration loop is readable; the default of one is too strict. The one
    # outlier (the HTML parser's single-pass loop) carries a justified per-site @Suppress instead.
    maxJumpCount: 2
  ThrowsCount:
    # requireData() validates several response invariants up-front with descriptive throws.
    max: 4

exceptions:
  TooGenericExceptionThrown:
    # docs/reference/architecture.md mandates wrapping Apollo / data errors in RuntimeException with a
    # descriptive message; throwing RuntimeException is therefore an intentional, documented convention.
    active: false
