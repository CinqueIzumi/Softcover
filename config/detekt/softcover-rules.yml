# Kept apart from detekt.yml because `:detekt-rules` cannot load its own plugin, so detekt's config
# validation would reject the `softcover` key there.
softcover:
  RawSpacingDp:
    active: true
  RawCornerDp:
    active: true
  RememberHapticsOutsideTheme:
    active: true
  UiModelBuiltInRender:
    active: true
    excludes: ['**/*Previews.kt', '**/gallery/**', '**/src/debug/**', '**/*Test/**', '**/test/**']
  ScreenConstructorProperty:
    active: true
    excludes: ['**/smoketest/**', '**/src/debug/**', '**/*Test/**', '**/test/**']
# The foundation's `rhaydus` ruleset; `NoReflection` restates its excludes with Softcover's extra source sets.
rhaydus:
  NoReflection:
    active: true
    excludes: ['**/smoketest/**', '**/src/debug/**', '**/*Test/**', '**/test/**']
