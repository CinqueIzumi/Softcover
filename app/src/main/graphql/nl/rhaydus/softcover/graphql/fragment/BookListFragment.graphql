fragment BookListFragment on books {
    id
    canonical {
        id
    }
    title
    description
    rating
    image {
        url
    }
    release_year
    users_count
    ratings_count
    compilation
    book_series(order_by: { position: asc }) {
        ...BookSeriesFragment
    }
    contributions {
        author {
            id
            name
        }
    }
}
