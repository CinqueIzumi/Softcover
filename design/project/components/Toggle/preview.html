<title>Toggle</title>

<body class="sc-stage body-medium">
<div class="sc-state"><span class="sc-state__label label-small">Filled icon, on</span><button type="button" class="sc-toggle sc-toggle--checked" role="switch" aria-checked="true" aria-label="Saved to your library"><svg class="sc-icon sc-icon--24" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 11v6.97l-5-2.14-5 2.14V5h6V3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V11h-2z"/><path transform="translate(13.5 .1) scale(.37)" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button></div>
