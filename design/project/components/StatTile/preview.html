<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatTile</title>
</head>
<body class="sc-stage body-medium">
<div class="sc-state sc-state--wide"><span class="sc-state__label label-small">Hero</span><div class="sc-stat-tile sc-stat-tile--hero"><span class="sc-stat-tile__eyebrow editorial-eyebrow">Total pages read</span><span class="sc-stat-tile__stat sc-stat-number editorial-stat-hero">12,481</span><div class="sc-stat-tile__rule"></div><span class="sc-stat-tile__caption editorial-body">All the pages you've turned so far.</span></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Standard</span><div class="sc-stat-tile sc-stat-tile--standard"><span class="sc-stat-tile__eyebrow editorial-eyebrow-small">Volumes</span><div><span class="sc-stat-number editorial-stat-large" style="display:block">38</span><span class="sc-stat-tile__caption editorial-body-small">books read</span></div></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Compact</span><div class="sc-stat-tile sc-stat-tile--compact"><span class="sc-stat-tile__eyebrow editorial-eyebrow-small">Avg. rating</span><div class="sc-stat-tile__figure"><span class="sc-stat-number editorial-headline-medium">4.2</span><span class="sc-stat-tile__unit editorial-body">★</span></div></div></div>
<div class="sc-state sc-state--wide"><span class="sc-state__label label-small">Hero, loading</span><div class="sc-stat-tile sc-stat-tile--hero"><span class="sc-stat-tile__eyebrow editorial-eyebrow">Total pages read</span><span class="sc-stat-tile__stat sc-stat-number editorial-stat-hero sc-skeleton" style="align-self:flex-start">0,000</span><div class="sc-stat-tile__rule"></div><span class="sc-stat-tile__caption editorial-body">All the pages you've turned so far.</span></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Standard, loading</span><div class="sc-stat-tile sc-stat-tile--standard"><span class="sc-stat-tile__eyebrow editorial-eyebrow-small">Volumes</span><div><span class="sc-stat-number editorial-stat-large sc-skeleton" style="display:inline-block">00</span><br><span class="sc-stat-tile__caption editorial-body-small">books read</span></div></div></div>
</body>
</html>
