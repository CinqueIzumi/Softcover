<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BookCover</title>
</head>
<body class="sc-stage body-medium">
<div class="sc-state"><span class="sc-state__label label-small">With cover art</span><div class="sc-cover sc-cover--shelf" role="img" aria-label="Cover of Piranesi" style="width:140px"><div class="sc-cover__art"></div></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Coverless, long title</span><div class="sc-cover sc-cover--shelf" role="img" aria-label="Cover of The Very Long and Overwrought Title of a Book That Will Not Fit" style="width:140px"><div class="sc-cover__monogram"><div class="sc-cover__frame" style="inset:8.0px"></div><p class="sc-cover__title editorial-headline-medium" style="font-size:16.0px;padding:0 12.0px">The Very Long and Overwrought Title of a Book That Will Not Fit</p></div></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Coverless, thumbnail-sized</span><div class="sc-cover sc-cover--flat" role="img" aria-label="Cover of The Name of the Wind" style="width:48px"><div class="sc-cover__monogram"><div class="sc-cover__frame" style="inset:2.9px"></div><span class="sc-cover__initial editorial-headline-medium" style="font-size:17.3px">T</span></div></div></div>
<div class="sc-state"><span class="sc-state__label label-small">Loading</span><div class="sc-cover sc-cover--shelf sc-cover--loading" style="width:140px"><div class="sc-cover__skeleton"></div></div></div>
</body>
</html>
