<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PillButton</title>
</head>
<body class="sc-stage body-medium">
<div class="sc-state"><span class="sc-state__label label-small">Large Tonal</span><button type="button" class="sc-pill-button label-medium sc-pill-button--large"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 11v6.97l-5-2.14-5 2.14V5h6V3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V11h-2zm4-3h-2V6h-2V4h2V2h2v2h2v2h-2v2z"/></svg></span><span>Add to list</span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Icon only, Tonal</span><button type="button" class="sc-pill-button label-medium sc-pill-button--icon-only" aria-label="Select books"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm4.59-12.42L10 14.17l-2.59-2.58L6 13l4 4 8-8z"/></svg></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Regular Accent</span><button type="button" class="sc-pill-button label-medium sc-pill-button--accent"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span><span>Update</span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Regular Filled</span><button type="button" class="sc-pill-button label-medium sc-pill-button--filled"><span>Add</span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Regular Outlined</span><button type="button" class="sc-pill-button label-medium sc-pill-button--outlined"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v2l1 5v2h-1v7H4v-7H3v-2l1-5V4zm2 9v5h12v-5H6z"/></svg></span><span>Bookshop</span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Quiet, with indicator</span><button type="button" class="sc-pill-button label-medium sc-pill-button--quiet"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></span><span>Filter</span><span class="sc-pill-button__indicator"></span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Regular Tonal</span><button type="button" class="sc-pill-button label-medium"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg></span><span>Sort</span></button></div>
<div class="sc-state"><span class="sc-state__label label-small">Disabled</span><button type="button" class="sc-pill-button label-medium sc-pill-button--disabled"><span class="sc-pill-button__icon" style="display:inline-flex"><svg class="sc-icon sc-icon--17" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15-5-2.18L7 18V5h10v13z"/></svg></span><span>Move</span></button></div>
</body>
</html>
